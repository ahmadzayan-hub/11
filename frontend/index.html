<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Agentic OS — an intelligent assistant workspace with conversation, memory, and preferences."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b1020" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='17' font-weight='700' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E"
    />
    <title>Agentic OS</title>
    <script>
      // Apply the saved theme and motion settings before first paint.
      try {
        var theme = localStorage.getItem('aos-theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme
        }
        if (localStorage.getItem('aos-motion') === 'reduce') {
          document.documentElement.dataset.motion = 'reduce'
        }
      } catch (error) {
        /* localStorage unavailable — system settings apply */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
