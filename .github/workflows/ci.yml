name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dev
          POSTGRES_DB: agentic_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The run-engine suite runs against BOTH SQLite and PostgreSQL.
      # REQUIRE_PG turns an unreachable database into a hard failure so
      # the Postgres path can never be silently skipped in CI.
      PG_TEST_URL: postgresql://dev@127.0.0.1:5432/agentic_test
      REQUIRE_PG: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Python tests (agent, utils, API, runs)
        run: python -m unittest discover tests -v

      - name: Python dependency audit (informational)
        # Advisory only: a new transitive CVE should be visible without
        # blocking unrelated changes; triage findings in the PR.
        continue-on-error: true
        run: pip install --quiet pip-audit && pip-audit

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend dependency audit
        run: npm audit --audit-level=high
        working-directory: frontend

      - name: Frontend unit tests
        run: npm test
        working-directory: frontend

      - name: Type check and production build
        run: npm run build
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: End-to-end and accessibility tests
        run: npx playwright test
        working-directory: frontend

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
